name: Check HotDoc

# The every-10-minutes schedule runs on cron-job.org, which calls the site's /api/poll route
# (GitHub's own schedules were arriving hours apart). This workflow is a manual "check now" button.
on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check availability and send alerts
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/poll"
          echo
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
